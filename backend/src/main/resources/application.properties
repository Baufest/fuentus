spring.datasource.url=jdbc:mysql://localhost:3306/scrapper
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.testOnBorrow=true
spring.datasource.validationQuery=SELECT 1

spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

server.servlet.contextPath=/api/fuentus
spring.jpa.hibernate.ddl-auto=update


# ===============================
# LOGGING CONFIGURATION
# ===============================
# Log4j2 configuration file location
logging.config=classpath:log4j2.xml

# Logging levels (se pueden sobrescribir por perfil)
logging.level.root=INFO
logging.level.ar.com.bbva.fuentus=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.mysql=INFO
logging.level.javax.naming=FATAL
logging.level.org.springframework.jndi=FATAL

# Log file configuration
logging.file.name=logs/fuentus.log
logging.file.path=logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.max-history=30

# Pattern for console and file
logging.pattern.console=%clr{%d{yyyy-MM-dd HH:mm:ss.SSS}}{faint} %clr{%5p} %clr{${PID:- }}{magenta} %clr{---}{faint} %clr{[%15.15t]}{faint} %clr{%-40.40c{1.}}{cyan} %clr{:}{faint} %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# ===============================
# CONFIGURACIÓN CORS
# ===============================
cors.allowed.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200

